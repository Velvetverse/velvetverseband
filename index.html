<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelvetVerse Band</title>

<meta http-equiv="refresh" content="6; url=index-v2.html">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

.intro{
  position:relative;
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.bg{
  position:absolute;
  inset:-4%;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.25),rgba(0,0,0,.35),rgba(0,0,0,.75)),
    url("intro-stage.jpg") center/cover no-repeat;
  animation:walkIn 6s ease-in-out forwards;
}

@keyframes walkIn{
  0%{transform:scale(1.08) translateY(0)}
  100%{transform:scale(1.18) translateY(-18px)}
}

.lights{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,190,90,.22),transparent 25%),
    radial-gradient(circle at 70% 20%,rgba(255,190,90,.20),transparent 25%),
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.15),transparent 30%);
  animation:pulse 1.6s infinite alternate;
}

@keyframes pulse{
  from{opacity:.45}
  to{opacity:1}
}

.smoke{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 55%,rgba(255,255,255,.10),transparent 24%),
    radial-gradient(circle at 75% 52%,rgba(255,255,255,.10),transparent 24%);
  animation:smokeMove 6s linear forwards;
}

@keyframes smokeMove{
  from{transform:translateX(-20px);opacity:.35}
  to{transform:translateX(35px);opacity:.75}
}

.content{
  position:relative;
  z-index:3;
  margin-top:42vh;
  animation:fadeIn 1.2s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

h1{
  font-family:Georgia,serif;
  font-size:62px;
  letter-spacing:9px;
  text-shadow:0 0 18px #fff,0 0 35px #ffb45c;
}

p{
  margin-top:12px;
  font-size:14px;
  letter-spacing:5px;
  color:#f2d8b0;
}

.enter{
  display:inline-block;
  margin-top:26px;
  padding:14px 32px;
  border:1px solid #ffb45c;
  border-radius:999px;
  color:#fff;
  font-weight:bold;
  letter-spacing:3px;
  text-decoration:none;
  background:rgba(0,0,0,.35);
  box-shadow:0 0 24px rgba(255,180,92,.35);
}

.loading{
  margin-top:18px;
  font-size:11px;
  letter-spacing:4px;
  color:#ddd;
  animation:blink 1s infinite alternate;
}

@keyframes blink{
  from{opacity:.35}
  to{opacity:1}
}

@media(max-width:720px){
  h1{font-size:34px;letter-spacing:5px}
  p{font-size:11px;letter-spacing:3px}
  .content{margin-top:46vh}
}
</style>
</head>

<body>

<section class="intro">
  <div class="bg"></div>
  <div class="lights"></div>
  <div class="smoke"></div>

  <div class="content">
    <h1>VELVETVERSE</h1>
    <p>THE UNIVERSE IS ABOUT TO BEGIN</p>
    <a class="enter" href="index-v2.html">ENTER NOW</a>
    <div class="loading">ENTERING THE STAGE...</div>
  </div>
</section>

</body>
</html>
