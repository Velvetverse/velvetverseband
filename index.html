<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelvetVerse Band</title>

<meta http-equiv="refresh" content="5; url=index-v2.html">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 35%,rgba(160,40,255,.35),transparent 28%),
    radial-gradient(circle at 25% 75%,rgba(255,45,45,.22),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(255,160,30,.18),transparent 28%),
    linear-gradient(135deg,#030305,#120017,#050101);
  display:flex;
  align-items:center;
  justify-content:center;
}

.stage{
  position:absolute;
  inset:0;
  background:
    linear-gradient(110deg,transparent 0%,rgba(255,255,255,.08) 45%,transparent 55%),
    linear-gradient(250deg,transparent 0%,rgba(180,60,255,.10) 45%,transparent 58%);
  animation:lights 5s ease-in-out infinite alternate;
}

@keyframes lights{
  from{opacity:.35;transform:scale(1)}
  to{opacity:.8;transform:scale(1.08)}
}

.box{
  position:relative;
  z-index:2;
  text-align:center;
  padding:55px 45px;
  max-width:900px;
  width:90%;
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  background:rgba(0,0,0,.45);
  box-shadow:
    0 0 60px rgba(170,60,255,.35),
    inset 0 0 50px rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  animation:enter .9s ease forwards;
}

@keyframes enter{
  from{opacity:0;transform:translateY(25px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.logo{
  font-family:Georgia,serif;
  font-size:72px;
  letter-spacing:9px;
  text-shadow:
    0 0 18px #fff,
    0 0 35px #b84cff,
    0 0 75px #7a1cff;
}

.sub{
  margin-top:8px;
  font-size:13px;
  letter-spacing:8px;
  color:#d9a7ff;
}

.line{
  width:420px;
  height:3px;
  margin:28px auto;
  background:linear-gradient(90deg,transparent,#b84cff,#fff,#ffb347,transparent);
  box-shadow:0 0 25px #b84cff;
}

h2{
  font-size:26px;
  letter-spacing:3px;
  margin-bottom:14px;
}

p{
  color:#ddd;
  font-size:15px;
  letter-spacing:2px;
  line-height:1.7;
}

.enter-btn{
  display:inline-block;
  margin-top:34px;
  padding:15px 34px;
  border:1px solid #d45cff;
  border-radius:999px;
  color:#fff;
  font-weight:bold;
  letter-spacing:3px;
  box-shadow:0 0 25px rgba(212,92,255,.35);
  transition:.25s;
}

.enter-btn:hover{
  background:rgba(212,92,255,.16);
  transform:translateY(-3px);
}

.loading{
  margin-top:26px;
  font-size:11px;
  letter-spacing:4px;
  color:#aaa;
  animation:pulse 1.2s infinite alternate;
}

@keyframes pulse{
  from{opacity:.35}
  to{opacity:1}
}

@media(max-width:720px){
  .logo{font-size:42px;letter-spacing:5px}
  .sub{letter-spacing:5px}
  .line{width:260px}
  h2{font-size:20px}
}
</style>
</head>

<body>

<div class="stage"></div>

<div class="box">
  <div class="logo">VELVETVERSE</div>
  <div class="sub">BAND</div>

  <div class="line"></div>

  <h2>Welcome to VelvetVerse Band</h2>
  <p>
    More than music. More than a band.<br>
    Enter the VelvetVerse Universe.
  </p>

  <a class="enter-btn" href="index-v2.html">ENTER NOW</a>

  <div class="loading">ENTERING THE UNIVERSE...</div>
</div>

</body>
</html>
